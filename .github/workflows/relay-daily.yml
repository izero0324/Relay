name: Relay Daily Scan

on:
  # Normal NYSE day:
  # Wake the runner at 15:05 ET, then wait in-runner until 15:30 ET.
  # Starting early absorbs GitHub schedule queue delays.
  schedule:
    - cron: "5 15 * * 1-5"
      timezone: "America/New_York"

  # Manual test button
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relay-daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      STATE_BRANCH: relay-state

    steps:

      # ============================================================
      # 1. Checkout latest Relay code
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas_market_calendars


      # ============================================================
      # 3. Check actual NYSE calendar
      #
      # Normal day:
      #   15:05 trigger waits until 15:30, then runs
      #   12:05 trigger skips
      #
      # Early close:
      #   12:05 trigger waits until 12:30, then runs
      #   15:05 trigger skips
      #
      # Holiday:
      #   both skip
      #
      # Manual:
      #   always run
      # ============================================================

      - name: Check NYSE trading day
        id: market
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta
          import time
          from zoneinfo import ZoneInfo

          import pandas_market_calendars as mcal


          event_name = os.environ.get(
              "EVENT_NAME",
              "",
          )

          event_schedule = os.environ.get(
              "EVENT_SCHEDULE",
              "",
          )


          if event_name == "workflow_dispatch":

              should_run = True
              reason = "Manual workflow run"

          else:

              now = datetime.now(
                  ZoneInfo("America/New_York")
              )

              today = now.date()

              nyse = mcal.get_calendar("NYSE")

              schedule = nyse.schedule(
                  start_date=today,
                  end_date=today,
              )


              if schedule.empty:

                  should_run = False

                  reason = (
                      f"{today} is not an NYSE trading day"
                  )

              else:

                  market_close = (
                      schedule.iloc[0]["market_close"]
                      .tz_convert("America/New_York")
                      .to_pydatetime()
                  )

                  # The recommendation is acted on 30 minutes before the
                  # actual NYSE close. Wake GitHub 25 minutes earlier so its
                  # queue delay normally happens before the target, not after.
                  target = (
                      market_close
                      - timedelta(minutes=30)
                  )

                  wake_time = (
                      target
                      - timedelta(minutes=25)
                  )

                  expected_cron = (
                      f"{wake_time.minute} {wake_time.hour} * * 1-5"
                  )

                  correct_schedule = (
                      event_schedule
                      == expected_cron
                  )

                  if not correct_schedule:

                      should_run = False

                      reason = (
                          f"NYSE close {market_close:%H:%M ET}; "
                          f"this cron ({event_schedule}) is not today's "
                          f"required wake-up ({expected_cron})"
                      )

                  else:

                      now = datetime.now(
                          ZoneInfo("America/New_York")
                      )

                      if now < target:

                          wait_seconds = (
                              target - now
                          ).total_seconds()

                          print(
                              f"Runner ready early; waiting "
                              f"{wait_seconds / 60:.1f} minutes until "
                              f"{target:%H:%M:%S ET}",
                              flush=True,
                          )

                          time.sleep(wait_seconds)

                          now = datetime.now(
                              ZoneInfo("America/New_York")
                          )

                      lateness = now - target

                      should_run = (
                          timedelta(0)
                          <= lateness
                          <= timedelta(minutes=5)
                      )

                      reason = (
                          f"NYSE close {market_close:%H:%M ET}; "
                          f"target {target:%H:%M ET}; "
                          f"actual start {now:%H:%M:%S ET}; "
                          f"lateness {lateness.total_seconds() / 60:.1f} min"
                      )


          print(reason)

          print(
              f"should_run={should_run}"
          )


          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
          ) as f:

              f.write(
                  "should_run="
                  + (
                      "true"
                      if should_run
                      else "false"
                  )
                  + "\n"
              )

              f.write(
                  f"reason={reason}\n"
              )

          PY


      # ============================================================
      # 4. Restore state from relay-state branch
      #
      # Stored state:
      #
      # scanner_state.json
      # trade_log.csv
      #
      # First successful run automatically creates relay-state.
      # ============================================================

      - name: Restore Relay state
        if: steps.market.outputs.should_run == 'true'
        run: |

          echo "Looking for ${STATE_BRANCH}"

          if git ls-remote \
            --exit-code \
            --heads \
            origin \
            "${STATE_BRANCH}" \
            >/dev/null 2>&1
          then

            echo "State branch exists."

            git fetch \
              origin \
              "${STATE_BRANCH}:refs/remotes/origin/${STATE_BRANCH}"


            for FILE in \
              scanner_state.json \
              trade_log.csv
            do

              if git cat-file \
                -e \
                "origin/${STATE_BRANCH}:${FILE}" \
                2>/dev/null
              then

                echo "Restoring ${FILE}"

                git show \
                  "origin/${STATE_BRANCH}:${FILE}" \
                  > "${FILE}"

              fi

            done

          else

            echo "No relay-state branch yet."

            echo "Using files currently on main."

          fi


      # ============================================================
      # 5. Determine model position
      #
      # Previous:
      #
      # HOLD
      # -> use previous Current_Position
      #
      # SWITCH
      # -> use previous Switch_To
      #
      # This is model/recommendation state.
      # It does NOT claim this is the actual broker position.
      # ============================================================

      - name: Determine model position
        id: position
        if: steps.market.outputs.should_run == 'true'
        run: |

          python - <<'PY'

          import csv
          import os


          ticker = "CASH"


          if os.path.exists(
              "trade_log.csv"
          ):

              with open(
                  "trade_log.csv",
                  newline="",
                  encoding="utf-8",
              ) as f:

                  rows = list(
                      csv.DictReader(f)
                  )


              if rows:

                  last = rows[-1]


                  current = (
                      last.get(
                          "Current_Position",
                          "",
                      )
                      .strip()
                      .upper()
                  )


                  action = (
                      last.get(
                          "Action",
                          "",
                      )
                      .strip()
                      .upper()
                  )


                  switch_to = (
                      last.get(
                          "Switch_To",
                          "",
                      )
                      .strip()
                      .upper()
                  )


                  if (
                      action == "SWITCH"
                      and switch_to
                  ):

                      ticker = switch_to

                  elif current:

                      ticker = current


          print(
              f"Model position: {ticker}"
          )


          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
          ) as f:

              f.write(
                  f"ticker={ticker}\n"
              )

          PY


      # ============================================================
      # 6. Run Relay
      #
      # Full terminal output is saved into relay_output.txt
      # ============================================================

      - name: Run Relay scanner
        id: relay
        if: steps.market.outputs.should_run == 'true'
        env:
          CURRENT_TICKER: ${{ steps.position.outputs.ticker }}
        shell: bash
        run: |

          echo "Model position: ${CURRENT_TICKER}"


          BEFORE_HASH="$(
            sha256sum \
              trade_log.csv \
              2>/dev/null |
            awk '{print $1}' ||
            true
          )"


          set +e


          python main.py \
            "${CURRENT_TICKER}" \
            2>&1 |
            tee relay_output.txt


          PYTHON_EXIT=${PIPESTATUS[0]}


          set -e


          AFTER_HASH="$(
            sha256sum \
              trade_log.csv \
              2>/dev/null |
            awk '{print $1}' ||
            true
          )"


          if \
            [ "${PYTHON_EXIT}" -eq 0 ] && \
            [ -n "${AFTER_HASH}" ] && \
            [ "${BEFORE_HASH}" != "${AFTER_HASH}" ]
          then

            echo "Relay scan completed."

            echo \
              "ok=true" \
              >> "${GITHUB_OUTPUT}"

          else

            echo \
              "Relay did not create a new trade-log entry."

            echo \
              "ok=false" \
              >> "${GITHUB_OUTPUT}"

          fi


          echo \
            "exit_code=${PYTHON_EXIT}" \
            >> "${GITHUB_OUTPUT}"


      # ============================================================
      # 7. Save state into relay-state
      #
      # relay-state:
      #
      # scanner_state.json
      # trade_log.csv
      #
      # runs/
      #   2026-08-17_15-35-xx.txt
      #   ...
      # ============================================================

      - name: Save Relay state
        id: state
        if: steps.relay.outputs.ok == 'true'
        shell: bash
        run: |

          RUN_STAMP="$(
            TZ=America/New_York \
            date +'%Y-%m-%d_%H-%M-%S'
          )"


          rm -rf \
            /tmp/relay-state


          if git show-ref \
            --verify \
            --quiet \
            "refs/remotes/origin/${STATE_BRANCH}"
          then

            git worktree add \
              -B "${STATE_BRANCH}" \
              /tmp/relay-state \
              "origin/${STATE_BRANCH}"

          else

            git worktree add \
              -b "${STATE_BRANCH}" \
              /tmp/relay-state \
              HEAD

          fi


          mkdir -p \
            /tmp/relay-state/runs


          cp \
            scanner_state.json \
            /tmp/relay-state/scanner_state.json


          cp \
            trade_log.csv \
            /tmp/relay-state/trade_log.csv


          cp \
            relay_output.txt \
            "/tmp/relay-state/runs/${RUN_STAMP}.txt"


          git \
            -C /tmp/relay-state \
            config \
            user.name \
            "github-actions[bot]"


          git \
            -C /tmp/relay-state \
            config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git \
            -C /tmp/relay-state \
            add \
            scanner_state.json \
            trade_log.csv \
            runs/


          if git \
            -C /tmp/relay-state \
            diff \
            --cached \
            --quiet
          then

            echo "No changes."

          else

            git \
              -C /tmp/relay-state \
              commit \
              -m \
              "state: Relay scan ${RUN_STAMP}"


            git \
              -C /tmp/relay-state \
              push \
              origin \
              "HEAD:${STATE_BRANCH}"

          fi


      # ============================================================
      # 8. Build Telegram report
      #
      # Includes:
      #
      # SPY trend
      # Regime
      #
      # Score
      # Momentum
      # Volume
      # Event
      # Flow
      #
      # Top candidates
      # Current model position
      # HOLD / SWITCH
      # Switch target
      # Edge streak
      # Reason
      # ============================================================

      - name: Build Telegram report
        id: telegram_report
        if: always() && steps.market.outputs.should_run == 'true'
        env:

          SCAN_OK: ${{ steps.relay.outputs.ok }}

          SCAN_EXIT_CODE: ${{ steps.relay.outputs.exit_code }}

          MODEL_POSITION: ${{ steps.position.outputs.ticker }}

          STATE_OUTCOME: ${{ steps.state.outcome }}

        run: |

          python - <<'PY'

          import csv
          import html
          import json
          import os
          import re

          from datetime import datetime
          from urllib.parse import quote
          from zoneinfo import ZoneInfo


          def read_text(path):

              try:

                  with open(
                      path,
                      encoding="utf-8",
                      errors="replace",
                  ) as f:

                      return f.read()

              except Exception:

                  return ""


          output = read_text(
              "relay_output.txt"
          )


          now = datetime.now(
              ZoneInfo(
                  "America/New_York"
              )
          )


          scan_ok = (
              os.environ.get(
                  "SCAN_OK"
              )
              == "true"
          )


          state_ok = (
              os.environ.get(
                  "STATE_OUTCOME"
              )
              == "success"
          )


          # ========================================================
          # FAILURE
          # ========================================================

          if (
              not scan_ok
              or not state_ok
          ):

              message = "\n".join([
                  "???? <b>RELAY SCAN FAILED</b>",

                  now.strftime(
                      "%Y-%m-%d %H:%M ET"
                  ),

                  "",

                  (
                      "Model position: "
                      + html.escape(
                          os.environ.get(
                              "MODEL_POSITION",
                              "?",
                          )
                      )
                  ),

                  (
                      "Scanner OK: "
                      + str(scan_ok)
                  ),

                  (
                      "State save: "
                      + html.escape(
                          os.environ.get(
                              "STATE_OUTCOME",
                              "unknown",
                          )
                      )
                  ),

                  (
                      "Exit code: "
                      + html.escape(
                          os.environ.get(
                              "SCAN_EXIT_CODE",
                              "unknown",
                          )
                      )
                  ),

                  "",

                  (
                      "Open the GitHub Actions run "
                      "for the full error output."
                  ),
              ])


          # ========================================================
          # SUCCESS
          # ========================================================

          else:

              current = os.environ.get(
                  "MODEL_POSITION",
                  "CASH",
              )


              # ----------------------------------------------------
              # SPY trend
              # ----------------------------------------------------

              spy_match = re.search(
                  r"SPY 5-day trend\s*:\s*(.+)",
                  output,
              )


              spy = (
                  spy_match.group(1).strip()
                  if spy_match
                  else "n/a"
              )


              # ----------------------------------------------------
              # Regime
              # ----------------------------------------------------

              regime_match = re.search(
                  r"Regime\s*:\s*(.+)",
                  output,
              )


              regime = (
                  regime_match.group(1).strip()
                  if regime_match
                  else "n/a"
              )


              # ----------------------------------------------------
              # Candidate table
              #
              # main.py:
              #
              # Ticker
              # Score
              # Momentum
              # Volume
              # Event
              # Flow
              # ----------------------------------------------------

              rows = []

              in_table = False


              row_pattern = re.compile(

                  r"^\s{2}"

                  r"([A-Z][A-Z0-9.\-]{0,9})"

                  r"\s+"

                  r"([0-9]+\.[0-9]{3})"

                  r"\s+"

                  r"([0-9]+\.[0-9]{3})"

                  r"\s+"

                  r"([0-9]+\.[0-9]{3})"

                  r"\s+"

                  r"([0-9]+\.[0-9]{3})"

                  r"\s+"

                  r"([0-9]+\.[0-9]{3})"

              )


              for line in output.splitlines():


                  if (
                      "TOP " in line
                      and "CANDIDATES" in line
                  ):

                      in_table = True

                      continue


                  if (
                      in_table
                      and "CURRENT POSITION"
                      in line
                  ):

                      break


                  if not in_table:

                      continue


                  match = (
                      row_pattern.match(
                          line
                      )
                  )


                  if match:

                      rows.append({

                          "ticker":
                              match.group(1),

                          "score":
                              match.group(2),

                          "momentum":
                              match.group(3),

                          "volume":
                              match.group(4),

                          "event":
                              match.group(5),

                          "flow":
                              match.group(6),

                      })


              # ----------------------------------------------------
              # Current score
              # ----------------------------------------------------

              current_score = "n/a"


              for row in rows:

                  if (
                      row["ticker"]
                      == current
                  ):

                      current_score = (
                          row["score"]
                      )

                      break


              if current_score == "n/a":

                  current_match = re.search(

                      r"CURRENT POSITION\s*:\s*"

                      + re.escape(current)

                      + r".*?"

                      r"Score\s*:\s*"

                      r"\[[^\]]+\]\s*"

                      r"([0-9]+\.[0-9]{3})",

                      output,

                      flags=re.S,

                  )


                  if current_match:

                      current_score = (
                          current_match.group(1)
                      )


              # ----------------------------------------------------
              # Decision
              # ----------------------------------------------------

              decision_match = re.search(

                  r"DECISION\s*:\s*\*{3}\s*"

                  r"(HOLD|SWITCH)"

                  r"\s*\*{3}",

                  output,

              )


              action = (

                  decision_match.group(1)

                  if decision_match

                  else "UNKNOWN"

              )


              # ----------------------------------------------------
              # Switch target
              # ----------------------------------------------------

              switch_match = re.search(

                  r"Consider switching to\s*:\s*"

                  r"([A-Z][A-Z0-9.\-]*)"

                  r"\s+\(score\s+"

                  r"([0-9.]+)"

                  r"\)",

                  output,

              )


              switch_to = ""

              switch_score = ""


              if switch_match:

                  switch_to = (
                      switch_match.group(1)
                  )

                  switch_score = (
                      switch_match.group(2)
                  )


              # ----------------------------------------------------
              # Full reason from trade_log.csv
              # ----------------------------------------------------

              reason = ""


              try:

                  with open(
                      "trade_log.csv",
                      newline="",
                      encoding="utf-8",
                  ) as f:

                      history = list(
                          csv.DictReader(f)
                      )


                  if history:

                      reason = (
                          history[-1].get(
                              "Reason",
                              "",
                          )
                      )

              except Exception:

                  pass


              # ----------------------------------------------------
              # Edge streak
              # ----------------------------------------------------

              streak = "n/a"


              try:

                  with open(
                      "scanner_state.json",
                      encoding="utf-8",
                  ) as f:

                      state = json.load(f)


                  streak = state.get(
                      "edge_streak",
                      "n/a",
                  )

              except Exception:

                  pass


              # ----------------------------------------------------
              # Action icon
              # ----------------------------------------------------

              action_icon = {

                  "HOLD": "???",

                  "SWITCH": "????",

              }.get(

                  action,

                  "???",

              )


              # ----------------------------------------------------
              # Candidate table
              # ----------------------------------------------------

              table_lines = [

                  (
                      f"{'Ticker':<7}"
                      f"{'Score':>6} "
                      f"{'Mom':>6} "
                      f"{'Vol':>6} "
                      f"{'Event':>6} "
                      f"{'Flow':>6}"
                  ),

                  (
                      "--------------------------------------"
                  ),

              ]


              for row in rows:


                  marker = (

                      " *"

                      if (
                          row["ticker"]
                          == current
                      )

                      else ""

                  )


                  table_lines.append(

                      f"{row['ticker']:<7}"

                      f"{row['score']:>6} "

                      f"{row['momentum']:>6} "

                      f"{row['volume']:>6} "

                      f"{row['event']:>6} "

                      f"{row['flow']:>6}"

                      f"{marker}"

                  )


              # ----------------------------------------------------
              # Message
              # ----------------------------------------------------

              lines = [

                  "???? <b>RELAY DAILY SCAN</b>",

                  now.strftime(
                      "%Y-%m-%d %H:%M ET"
                  ),

                  "",

                  (
                      "Current holding : "
                      + html.escape(
                          current
                      )
                  ),

                  (
                      "SPY 5-day trend : "
                      + html.escape(
                          spy
                      )
                  ),

                  (
                      "Regime          : "
                      + html.escape(
                          regime
                      )
                  ),

                  "",

                  "???? <b>TOP CANDIDATES</b>",

                  "",

                  (
                      "<pre>"
                      + html.escape(
                          "\n".join(
                              table_lines
                          )
                      )
                      + "</pre>"
                  ),

                  "",

                  "???? <b>CURRENT POSITION</b>",

                  (
                      html.escape(
                          current
                      )
                      + " ??? Score "
                      + html.escape(
                          current_score
                      )
                  ),

                  "",

                  (
                      f"{action_icon} "
                      "<b>DECISION: "
                      + html.escape(
                          action
                      )
                      + "</b>"
                  ),

              ]


              if (
                  action == "SWITCH"
                  and switch_to
              ):

                  lines.append(

                      "??? "

                      + html.escape(
                          current
                      )

                      + " ??? "

                      + html.escape(
                          switch_to
                      )

                      + " (score "

                      + html.escape(
                          switch_score
                      )

                      + ")"

                  )


              # ----------------------------------------------------
              # Recommended-stock company profile
              # ----------------------------------------------------

              profile_ticker = (
                  switch_to
                  if action == "SWITCH" and switch_to
                  else current
              )


              if profile_ticker and profile_ticker != "CASH":

                  # Yahoo represents class-share dots as dashes in URLs
                  # (for example BRK.B -> BRK-B).
                  yahoo_symbol = quote(
                      profile_ticker.replace(".", "-"),
                      safe="-",
                  )

                  profile_url = (
                      "https://finance.yahoo.com/quote/"
                      + yahoo_symbol
                      + "/profile/"
                  )

                  lines.append(
                      "???? <a href=\""
                      + html.escape(profile_url, quote=True)
                      + "\">??¥ç?? "
                      + html.escape(profile_ticker)
                      + " ??¬å?¸ä??ç´?</a>"
                  )


              lines.extend([

                  (
                      "Edge streak: "
                      + html.escape(
                          str(streak)
                      )
                  ),

                  "",

                  "<b>Reason</b>",

                  html.escape(
                      reason
                      or "n/a"
                  ),

              ])


              message = "\n".join(
                  lines
              )


          # Keep below Telegram message limit.
          # Do not cut HTML in half.

          if len(message) > 4000:

              raise RuntimeError(

                  "Telegram message "
                  "unexpectedly too long: "
                  f"{len(message)} chars"

              )


          with open(
              "telegram_message.txt",
              "w",
              encoding="utf-8",
          ) as f:

              f.write(
                  message
              )


          print(
              message
          )

          PY


      # ============================================================
      # 9. Send Telegram message to multiple people
      #
      # GitHub Secret:
      #
      # TELEGRAM_CHAT_IDS
      #
      # Example:
      #
      # 123456789,987654321,555666777
      # ============================================================

      - name: Send Telegram notification
        if: always() && steps.market.outputs.should_run == 'true'
        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}

        shell: bash
        run: |


          if [
            -z "${TELEGRAM_BOT_TOKEN}"
          ]
          then

            echo \
              "Missing TELEGRAM_BOT_TOKEN."

            exit 1

          fi


          if [
            -z "${TELEGRAM_CHAT_IDS}"
          ]
          then

            echo \
              "Missing TELEGRAM_CHAT_IDS."

            exit 1

          fi


          if [
            ! -f telegram_message.txt
          ]
          then

            echo \
              "telegram_message.txt missing."

            exit 1

          fi


          IFS=',' \
            read -ra CHAT_IDS \
            <<< "${TELEGRAM_CHAT_IDS}"


          SEND_FAILURE=0


          for CHAT_ID in \
            "${CHAT_IDS[@]}"
          do


            CHAT_ID="$(
              echo "${CHAT_ID}" |
              xargs
            )"


            if [
              -z "${CHAT_ID}"
            ]
            then

              continue

            fi


            echo \
              "Sending Relay report to ${CHAT_ID}"


            if ! curl \
              --fail-with-body \
              --silent \
              --show-error \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "parse_mode=HTML" \
              --data-urlencode \
              "text@telegram_message.txt"
            then

              echo

              echo \
                "Telegram failed: ${CHAT_ID}"

              SEND_FAILURE=1

            else

              echo

              echo \
                "Telegram sent: ${CHAT_ID}"

            fi

          done


          if [
            "${SEND_FAILURE}"
            -ne 0
          ]
          then

            exit 1

          fi


      # ============================================================
      # 10. Show scanner/state failures as RED after Telegram has
      # received the failure notification.
      # ============================================================

      - name: Mark failed scan
        if: >
          steps.market.outputs.should_run == 'true' &&
          steps.relay.outputs.ok != 'true'
        run: |

          echo \
            "Relay scan failed."

          exit 1


      - name: Mark failed state save
        if: >
          steps.market.outputs.should_run == 'true' &&
          steps.relay.outputs.ok == 'true' &&
          steps.state.outcome != 'success'
        run: |

          echo \
            "State persistence failed."

          exit 1
